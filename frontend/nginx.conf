server {
    listen 80;
    server_name localhost;
    
    # === 前端 SPA 静态资源禁用缓存 ===
    # 防止浏览器缓存旧版前端
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    
    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: 只对无扩展名的路径 fallback 到 index.html
        # 静态资源(.js .css .png 等)找不到必须返回 404
        try_files $uri $uri/ @spa;
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # SPA 路由 fallback: 仅对无扩展名或 HTML 类请求回退到 index.html
    location @spa {
        # 如果 URI 带扩展名(比如 .js/.css/.png)但找不到, 返回真 404
        if ($uri ~* \.[a-zA-Z0-9]+$) {
            return 404;
        }
        # 否则当作 SPA 路由, 由 Vue Router 处理
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # === 路由名拼写顺序修复 ===
    # 前端调用 /v1/api_automation/* 后端实际注册的是 /v1/automation_api/*
    location /api/v1/api_automation/ {
        proxy_pass http://backend:8100/api/v1/automation_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        alias /www/wwwroot/backend/static/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ^~ /api/static/ {
        alias /www/wwwroot/backend/static/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~ ^/api/v1/ai/conversation/[0-9]+/ws$ {
        proxy_pass http://127.0.0.1:8100;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        tcp_nodelay on;
    }
    
    # API 代理
    location /api/v1/ {
        proxy_pass http://backend:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, DELETE, PUT" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, token" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, DELETE, PUT" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, token" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
        
    
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
}
